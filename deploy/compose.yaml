services:
  hub:
    image: nf-workbench:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your canonical HTTPS origin in deploy/.env}
      DATABASE_PATH: ${DATABASE_PATH:-/data/hub.sqlite}
      BIND_HOST: 0.0.0.0
      PORT: "17900"
      # Exactly one immediate TCP peer. HTTP forwarding headers do not grant trust.
      TRUSTED_PROXY_IP: 192.0.2.2
    volumes:
      - hub-data:/data
    networks:
      backend:
        ipv4_address: 192.0.2.3
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # No published backend port and no invented public health endpoint.

  caddy:
    image: nf-workbench-proxy:local
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your canonical HTTPS origin in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: 192.0.2.2
      edge: {}
    depends_on:
      - hub
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Intentionally no ports here. Add compose.public.yaml only when exposing HTTP/S.
    # For internal TLS, mount a trusted certificate/key read-only and configure Caddy's
    # tls directive. No CA is installed or generated by these templates.

networks:
  backend:
    internal: true
    ipam:
      config:
        # RFC 5737 documentation subnet, used only inside this Docker bridge.
        # If changed, update both static addresses AND TRUSTED_PROXY_IP together.
        - subnet: 192.0.2.0/29
  edge: {}

volumes:
  # Fresh named volumes copy their private ownership from the respective image.
  # Existing/bind-mounted directories need equivalent UID ownership and 0700 mode.
  hub-data: {}
  caddy-data: {}
  caddy-config: {}
